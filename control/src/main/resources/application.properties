
spring.application.name=control

# Configuración de la base de datos MySQL
spring.datasource.name=controlsamllsass
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://127.0.0.1:3306/controlsamllsass}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:10122001}

# Configuración de Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Configuración de Swagger
spring.openapi.info.title=Control API
spring.openapi.info.description=Api rest para el sistema de administracion de centros comerciales Small Control
springdoc.api-docs-enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.packagesToScan=backend.samll.control

