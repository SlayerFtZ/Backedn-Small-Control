spring.application.name=control
#Configuracion de la base de datos
#conexion a la base de datos mysql
spring.datasource.name=controlsamllsass
spring.datasource.url=jdbc:mysql://127.0.0.1:3306/controlsamllsass
spring.datasource.username=root
spring.datasource.password=10122001
# Configura la estrategia de generación de esquema de la base de datos usando Hibernate DDL auto.
# Valores posibles: 
# - create-drop: Crea la base de datos al iniciar la aplicación y la elimina al finalizar.
# - create: Crea la base de datos al iniciar la aplicación si no existe.
# - update: Actualiza el esquema de la base de datos si ya existe, pero no lo crea si no existe.
# - validate: Valida el esquema de la base de datos sin modificarlo.
# - none: No realiza ninguna operación automática en el esquema de la base de datos.
spring.jpa.hibernate.ddl-auto=update

# Activa el registro de consultas SQL en la consola del terminal.
# Esto puede ser útil para depurar y entender qué consultas SQL está ejecutando el framework.
spring.jpa.show-sql=true

# Especifica el dialecto de SQL que debe usar Hibernate para interactuar con la base de datos.
# En este caso, se utiliza el dialecto de MySQL 5.
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
#Configuracion para swagger web
spring.openapi.info.title=Control API
spring.openapi.info.description=Api rest para el sistema de administracion de centros comerciales Small Control
springdoc.api-docs-enabled=true
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.path=/doc/swagger-ui.html
springdoc.packagesToScan=backend.samll.control
